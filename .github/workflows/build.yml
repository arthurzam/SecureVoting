name: build

on:
  push:
    branches: [original]
  workflow_dispatch:

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tallier)
        id: tallier
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arthurzam/SecureVoting
          tags: |
            type=raw,value=tallier-latest

      - name: Docker meta (webserver)
        id: webserver
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arthurzam/SecureVoting
          tags: |
            type=raw,value=webserver-latest

      - name: Build and push (tallier)
        uses: docker/build-push-action@v5
        with:
          context: src/tallier
          file: src/tallier/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tallier.outputs.tags }}
          labels: ${{ steps.tallier.outputs.labels }}

      - name: Build and push (webserver)
        uses: docker/build-push-action@v5
        with:
          context: src/webserver
          file: src/webserver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.webserver.outputs.tags }}
          labels: ${{ steps.webserver.outputs.labels }}
